name: emobase-portal

# Images are published to GitHub Container Registry by the workflows in the
# emobase-genomics and emobase-portal-web repositories. Pin a specific tag in
# .env (a release such as v0.6.0, or an immutable sha-<short> build) for
# production.
# The same genomics image is used by the API, workers and one-shot jobs.
# To build the images locally instead of pulling them, see compose.local.yml.
x-genomics-service: &genomics-service
  image: ${EMOBASE_GENOMICS_IMAGE:-ghcr.io/emobase/emobase-genomics:dev}
  restart: unless-stopped

# Configuration shared by the API, workers and one-shot jobs. Genomics reads
# these with Viper using EMOBASE_GENOMICS_ as the environment prefix.
x-genomics-environment: &genomics-environment
  EMOBASE_GENOMICS_ENV_PREFIX: emobase_genomics
  EMOBASE_GENOMICS_HTTP__MODE: ${EMOBASE_GENOMICS_HTTP__MODE:-release}
  EMOBASE_GENOMICS_MYSQL__HOST: ${EMOBASE_GENOMICS_MYSQL__HOST:-mysql}
  EMOBASE_GENOMICS_MYSQL__PORT: ${EMOBASE_GENOMICS_MYSQL__PORT:-3306}
  EMOBASE_GENOMICS_MYSQL__USER: ${EMOBASE_GENOMICS_MYSQL__USER:-root}
  EMOBASE_GENOMICS_MYSQL__PASSWORD: ${MYSQL_ROOT_PASSWORD}
  EMOBASE_GENOMICS_MYSQL__DATABASE: ${EMOBASE_GENOMICS_MYSQL__DATABASE:-emobase_genomics}
  # Shared Elasticsearch from emobase-infra. The portal has no local instance.
  EMOBASE_GENOMICS_ELASTICSEARCH__ADDRESSES: http://elasticsearch:9200
  EMOBASE_GENOMICS_ELASTICSEARCH__INDEX_PREFIX: ${EMOBASE_GENOMICS_ELASTICSEARCH__INDEX_PREFIX:-genomics}
  EMOBASE_GENOMICS_BLAST__DISPLAY_NAME: ${EMOBASE_GENOMICS_BLAST__DISPLAY_NAME:-EMOBase}
  EMOBASE_GENOMICS_BLAST__CONTAINER_NAME: ${BLAST_CONTAINER_NAME:-emobase-portal-blast}

services:
  # ── Frontend web UI (Astro SSR) ──────────────────────────────────────────
  fe:
    image: ${EMOBASE_PORTAL_WEB_IMAGE:-ghcr.io/emobase/emobase-portal-web:main}
    container_name: emobase-portal-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      # nginx allows 16k per header line; Node limits all headers together.
      # The extra Node headroom covers the request line and the other headers.
      NODE_OPTIONS: --max-http-header-size=32768
      PUBLIC_SERVER: ${PUBLIC_SERVER}
      # All public URLs are relative paths by convention; the web UI resolves
      # them against PUBLIC_SERVER (see getUrlEnv in emobase-portal-web).
      # Server-to-server calls use explicit internal URLs and fall back to the
      # matching public URL when they are not set.
      PUBLIC_APIS_BASE_URL: /api
      PUBLIC_DOWNLOAD_URL: /download/
      PUBLIC_UI_PAGE_GENOMEBROWSER: /jbrowse/
      PUBLIC_UI_PAGE_BLAST: /blast/
      PUBLIC_UI_PAGE_API_DOC: /api/genomicsservice/v1/docs
      INTERNAL_API_GENOMICS_SERVICE: ${INTERNAL_API_GENOMICS_SERVICE:-http://genomicsservice:8080}
      INTERNAL_KEYCLOAK_ISSUER: ${KEYCLOAK_INTERNAL_URL:-${KEYCLOAK_PUBLIC_URL}}/realms/${KEYCLOAK_REALM}
      AUTH_SECRET: ${AUTH_SECRET}
      # Canonical browser-facing origin for Auth.js redirects. Deriving it from
      # PUBLIC_SERVER avoids reconstructing it from proxy headers.
      AUTH_URL: ${PUBLIC_SERVER}
      AUTH_TRUST_HOST: "true"
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      genomicsservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks:
      - default
      - emobase-infra

  # ── Genomics API ─────────────────────────────────────────────────────────
  genomicsservice:
    <<: *genomics-service
    container_name: emobase-portal-genomicsservice
    command: ["api", "-c", "/app/config.yaml"]
    environment:
      <<: *genomics-environment
      EMOBASE_GENOMICS_KEYCLOAK__URL: ${KEYCLOAK_INTERNAL_URL:-${KEYCLOAK_PUBLIC_URL}}
      EMOBASE_GENOMICS_KEYCLOAK__REALM: ${KEYCLOAK_REALM}
      EMOBASE_GENOMICS_KEYCLOAK__ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      EMOBASE_GENOMICS_KEYCLOAK__REQUIRED_ROLE: default-roles-${KEYCLOAK_REALM}
      # Must match the public path proxied by nginx; tus uses it to build the
      # Location header returned to the browser.
      EMOBASE_GENOMICS_UPLOADS__TUS_BASE_PATH: /api/genomicsservice/v1/uploads
      # Advertised by /docs/openapi.yaml (Swagger UI "Servers"). Must be the
      # public portal base, not the internal service URL, so "Try it out"
      # targets what the browser can reach.
      EMOBASE_GENOMICS_OPENAPI__SERVER_URL: ${EMOBASE_GENOMICS_OPENAPI__SERVER_URL:-${PUBLIC_SERVER}/api/genomicsservice/v1}
    volumes:
      - ${PUBLIC_DATA_DIR}/emobase-genomics:/app/public/uploads
      - jbrowse2-data:/web/
      - blast-data:/db/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks:
      - default
      - emobase-infra

  # ── Genomics job workers ─────────────────────────────────────────────────
  # Workers run JBrowse2/BLAST setup scripts and restart the blast container
  # after rebuilding databases, hence the Docker socket mount.
  genomicsworker-1:
    <<: *genomics-service
    container_name: emobase-portal-genomicsworker-1
    command: ["worker", "-c", "/app/config.yaml"]
    environment: *genomics-environment
    volumes:
      - ${PUBLIC_DATA_DIR}/emobase-genomics:/app/public/uploads
      - jbrowse2-data:/web/
      - blast-data:/db/
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - emobase-infra

  genomicsworker-2:
    <<: *genomics-service
    container_name: emobase-portal-genomicsworker-2
    command: ["worker", "-c", "/app/config.yaml"]
    environment: *genomics-environment
    volumes:
      - ${PUBLIC_DATA_DIR}/emobase-genomics:/app/public/uploads
      - jbrowse2-data:/web/
      - blast-data:/db/
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - emobase-infra

  # ── Keycloak ─────────────────────────────────────────────────────────────
  # The portal owns Keycloak. It is only reachable through the nginx above
  # (/keycloak); the database stays in emobase-infra.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: emobase-portal-keycloak
    restart: unless-stopped
    command: ["start", "--health-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL}/
      KC_HOSTNAME_ADMIN_URL: ${KEYCLOAK_PUBLIC_URL}/
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_RELATIVE_PATH: /keycloak/
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: mysql
      KC_DB_URL_HOST: mysql
      KC_DB_URL_PORT: 3306
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KC_DB_SCHEMA: keycloak
      JAVA_OPTS: ${KEYCLOAK_JAVA_OPTS:--Xms256m -Xmx768m}
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /keycloak/health/ready HTTP/1.0\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 10s
      retries: 18
    expose:
      - "8080"
    networks:
      default:
      emobase-infra:
        aliases:
          - keycloak

  # ── Reverse proxy / public entrypoint ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: emobase-portal-nginx
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-9080}:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PUBLIC_DATA_DIR}:/download/:ro
      - jbrowse2-data:/jbrowse/:ro
    depends_on:
      fe:
        condition: service_healthy
      genomicsservice:
        condition: service_healthy
      blast:
        condition: service_started

  # ── BLAST (SequenceServer) ───────────────────────────────────────────────
  blast:
    image: wurmlab/sequenceserver:latest
    # The upstream image is published for linux/amd64 only.
    platform: linux/amd64
    container_name: ${BLAST_CONTAINER_NAME:-emobase-portal-blast}
    restart: unless-stopped
    tty: true
    mem_limit: 1g
    # Fix the redirect URL produced after a job is submitted on the BLAST page.
    # Keep it root-relative so it stays on the origin that served the page;
    # the page is often embedded in an iframe on a different host.
    command:
      - sh
      - -c
      - |
        sed -i 's|redirect to("/#{job.id}")|redirect to("/blast/#{job.id}")|g' \
          /sequenceserver/lib/sequenceserver/routes.rb
        # SequenceServer emits root-absolute asset URLs by default, which 404
        # when it is proxied under a subpath. The portal and species sites both
        # serve BLAST at /blast/.
        sed -i "s|set :asset_prefix, ''|set :asset_prefix, '/blast'|" \
          /sequenceserver/lib/sequenceserver/routes.rb
        sequenceserver -r /opt/links_jbrowse2.rb
    environment:
      PUBLIC_SERVER: ${PUBLIC_SERVER}
      JBROWSE_CONFIG: /jbrowse2/data/config.json
    volumes:
      - blast-data:/db/
      # Adds the "Genome Browser" link to hits from *-genome databases.
      - ./blast/links_jbrowse2.rb:/opt/links_jbrowse2.rb:ro
      # Read-only access to the assembly/track IDs in JBrowse2's config.json.
      - jbrowse2-data:/jbrowse2:ro

  # ── Infrastructure ───────────────────────────────────────────────────────
  # MySQL and Elasticsearch run in the shared emobase-infra stack. Keycloak
  # runs above and uses that MySQL. This stack joins the external network and
  # reaches the services as mysql:3306, keycloak:8080 and elasticsearch:9200.

  # ── One-shot setup / migration services ──────────────────────────────────
  setup-jbrowse2-web:
    <<: *genomics-service
    container_name: emobase-portal-setup-jbrowse2-web
    restart: "no"
    entrypoint: []
    # Download a pinned release directly instead of asking the GitHub API for
    # the latest one. Anonymous GitHub API calls are limited to 60 per hour per
    # IP and fail with HTTP 403 on shared hosts.
    environment:
      JBROWSE_DOWNLOAD_URL: ${JBROWSE_DOWNLOAD_URL:-https://github.com/GMOD/jbrowse-components/releases/download/v4.3.0/jbrowse-web-v4.3.0.zip}
    # Skip the download when the volume already holds a JBrowse2 install, so
    # re-running setup does not fail or overwrite existing data.
    command: ["sh", "-c", "test -f /web/index.html || jbrowse create /web --url \"$${JBROWSE_DOWNLOAD_URL}\""]
    volumes:
      - jbrowse2-data:/web/
    profiles:
      - setup

  migrate-genomics-db:
    <<: *genomics-service
    container_name: emobase-portal-migrate-genomics-db
    restart: "no"
    command: ["db:migrate", "-c", "/app/config.yaml"]
    environment: *genomics-environment
    networks:
      - default
      - emobase-infra
    profiles:
      - update

  migrate-genomics-es:
    <<: *genomics-service
    container_name: emobase-portal-migrate-genomics-es
    restart: "no"
    command: ["es:migrate", "-c", "/app/config.yaml"]
    environment: *genomics-environment
    networks:
      - default
      - emobase-infra
    profiles:
      - update

volumes:
  blast-data:
  jbrowse2-data:

networks:
  # Created by emobase-infra. Use the same EMOBASE_INFRA_NETWORK value in all
  # three stacks.
  emobase-infra:
    external: true
    name: ${EMOBASE_INFRA_NETWORK:-emobase-infra}
