events {
}

http {
  include /etc/nginx/mime.types;

  # Preserve X-Forwarded-Host / X-Forwarded-Proto when another TLS-terminating
  # proxy sits in front of this container; fall back to the local request.
  map $http_x_forwarded_host $forwarded_host {
    ""      $http_host;
    default $http_x_forwarded_host;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
  }

  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;

  server {
    listen 80;

    # Internal Docker DNS, cached briefly so nginx can start before services.
    resolver 127.0.0.11 valid=30s;

    client_max_body_size 10m;

    # Auth.js and Keycloak cookies can exceed nginx's 8k default header
    # buffer, especially after several login attempts or with large JWT
    # session cookies.
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # ── Portal web UI ──────────────────────────────────────────────────────
    location / {
      set $upstream http://fe:8080;
      proxy_pass $upstream;
    }

    # ── Public downloads ───────────────────────────────────────────────────
    # Includes version files and assembly images stored under
    # ${PUBLIC_DATA_DIR}/emobase-genomics/.
    location /download/ {
      alias /download/;
      autoindex on;
      add_header Access-Control-Allow-Origin *;
    }

    # ── Keycloak ───────────────────────────────────────────────────────────
    location /ibb/keycloak/ {
      set $upstream keycloak;
      proxy_pass http://$upstream:8080;
    }

    # ── JBrowse2 static files ──────────────────────────────────────────────
    location = /ibb/jbrowse2 {
      return 301 /ibb/jbrowse2/;
    }

    location /ibb/jbrowse2/ {
      alias /ibb/jbrowse2/;
      add_header Access-Control-Allow-Origin *;
      include /etc/nginx/mime.types;
    }

    # ── BLAST (SequenceServer) ─────────────────────────────────────────────
    location = /ibb/blast {
      return 301 /ibb/blast/;
    }

    location /ibb/blast/ {
      # The variable trick cannot be used here; SequenceServer does not render
      # correctly when nginx resolves the upstream per request.
      proxy_pass http://blast:4567/;
      proxy_set_header X-Script-Name /ibb/blast;
      proxy_set_header Host $http_host;
      proxy_intercept_errors on;
      proxy_connect_timeout 8s;
      proxy_read_timeout 180s;
    }

    # ── Genomics API ───────────────────────────────────────────────────────
    # Longer prefix first: TUS uploads need streaming and forwarded headers.
    location /ibb/api/genomicsservice/v1/uploads {
      set $upstream http://genomicsservice:8080;
      proxy_pass $upstream;
      rewrite ^/ibb/api/genomicsservice/v1/(.*)$ /$1 break;

      client_max_body_size 30m;

      # TUS: disable buffering and keep the connection alive for PATCH.
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_http_version 1.1;

      # TUS: forward hostname and scheme so tus builds the correct Location URL.
      proxy_set_header X-Forwarded-Host $forwarded_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Host $http_host;
    }

    location /ibb/api/genomicsservice {
      set $upstream http://genomicsservice:8080;
      proxy_pass $upstream;
      rewrite ^/ibb/api/genomicsservice/v1/(.*)$ /$1 break;
    }
  }
}
